[project]
name = "tollgate"
version = "0.1.0"
description = "The release gate for AI agent security changes: break, patch, price, ship or revert."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tenacity>=8.2",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
embeddings = ["sentence-transformers>=3.0"]  # optional Tier-1 upgrade; TF-IDF is the default backend

[project.scripts]
tollgate = "tollgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
